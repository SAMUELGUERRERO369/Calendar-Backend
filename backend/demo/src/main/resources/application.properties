spring.application.name=demo
spring.data.mongodb.uri=mongodb://localhost:27017/calendar
# JWT Configuration - Secret real de 64 caracteres hexadecimales (256 bits para HS256)
jwt.secret=a1b2c3d4e5f6789012345678abcdef0123456789abcdef0123456789abcdef01
# Access token: 15 minutos (900000 ms)
jwt.access-expiration=900000
# Refresh token: 7 días (604800000 ms)
jwt.refresh-expiration=604800000

# Logging configuration for debugging
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.context.annotation=TRACE
logging.level.org.springframework.beans=DEBUG
